<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mission Control Designs CRM — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-brand">
        <span class="brand-mark">MC</span>
      </div>
      <h1>Mission Control<span>Designs CRM</span></h1>
      <form id="login-form">
        <label>
          Username
          <input type="text" id="login-username" autocomplete="username" autofocus required />
        </label>
        <label>
          Password
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="login-error" hidden></p>
        <button type="submit" class="btn btn-primary login-submit">Log In</button>
      </form>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
